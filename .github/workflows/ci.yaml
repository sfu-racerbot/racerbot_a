name: ROS2 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    container:
      image: ros:humble-ros-base-jammy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: src/racerbot_a

      - name: Cache colcon build artifacts
        uses: actions/cache@v4
        with:
          path: |
            build
            install
            log
          key: colcon-${{ runner.os }}-humble-${{ hashFiles('src/**/package.xml', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            colcon-${{ runner.os }}-humble-

      - name: Build ROS 2 packages
        shell: bash
        run: |
          apt-get update -y
          source /opt/ros/humble/setup.bash
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y
          colcon build